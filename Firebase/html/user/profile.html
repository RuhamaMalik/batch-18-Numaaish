<!DOCTYPE html>
<html lang="ur">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #ffffff;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
        }

        .card-header {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            height: 100px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            margin-top: -50px;
            object-fit: cover;
        }

        .info-container {
            padding: 20px 25px 25px 25px;
            text-align: left;
        }

        .info-group {
            margin-bottom: 12px;
        }

        .info-label {
            font-size: 11px;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: block;
        }

        .info-input {
            width: 100%;
            padding: 8px 10px;
            font-size: 14px;
            color: #222222;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            outline: none;
            background-color: #f9f9f9;
            transition: all 0.3s ease;
        }

        .info-input:disabled {
            background-color: #f4f4f4;
            color: #555555;
            border-color: transparent;
            cursor: not-allowed;
        }

        .info-input:enabled {
            background-color: #ffffff;
            border-color: #4f46e5;
            box-shadow: 0 0 5px rgba(79, 70, 229, 0.2);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #4f46e5;
            color: white;
            text-align: center;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            margin-top: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #4338ca;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="card-header"></div>
        <img src="https://cdn.vectorstock.com/i/500p/94/54/starry-shirt-girl-cartoon-avatar-vector-61679454.jpg"
            alt="User Image" class="profile-img">

        <div class="info-container">
            <div class="info-group">
                <label class="info-label">Full Name</label>
                <input id="name" type="text" class="info-input" disabled>
            </div>

            <div class="info-group">
                <label class="info-label">Title</label>
                <input id="title" type="text" class="info-input" disabled>
            </div>

            <div class="info-group">
                <label class="info-label">Email</label>
                <input id="email" type="email" class="info-input" disabled>
            </div>

            <div class="info-group">
                <label class="info-label">Contact Number</label>
                <input id="contact" type="tel" class="info-input" disabled>
            </div>

            <div class="info-group">
                <label class="info-label">Location</label>
                <input id="country" type="text" class="info-input" disabled>
            </div>

            <button type="button" class="btn" id="toggleBtn">Edit Profile</button>
        </div>
    </div>
