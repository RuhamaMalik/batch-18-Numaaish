<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #f4f7fe;
      color: #333;
    }

    /* Sidebar Styles */
    .sidebar {
      width: 250px;
      background-color: #1e293b;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 30px;
      color: #38bdf8;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar ul li {
      padding: 12px 15px;
      margin-bottom: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .sidebar ul li:hover, .sidebar ul li.active {
      background-color: #334155;
      color: #38bdf8;
    }

    /* Main Content Layout */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* Header */
    header {
      background-color: #fff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
    }

    .search-box input {
      padding: 8px 14px;
      width: 260px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #38bdf8;
    }

    /* Content Area */
    .content {
      padding: 30px;
    }

    .card {
      background-color: #fff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    /* Table Styles */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      text-align: left;
      padding: 12px 15px;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background-color: #f8fafc;
      color: #64748b;
      font-weight: 600;
    }

    tr:hover {
      background-color: #f1f5f9;
    }

    .status {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .status.active {
      background-color: #dcfce7;
      color: #166534;
    }

    .status.inactive {
      background-color: #fee2e2;
      color: #991b1b;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .pagination button {
      padding: 6px 12px;
      border: 1px solid #cbd5e1;
      background-color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .pagination button:hover:not(:disabled) {
      background-color: #f1f5f9;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Admin Dashboard</h2>
    <ul>
      <li class="active">Users</li>
      <li>Analytics</li>
      <li>Settings</li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <header>
      <h1>User Management</h1>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search users by name or email...">
      </div>
    </header>

    <div class="content">
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <!-- JavaScript se data yahan fill hoga -->
          </tbody>
        </table>

        <!-- Pagination Controls -->
        <div class="pagination">
          <button id="prevBtn">Previous</button>
          <span id="pageIndicator">Page 1</span>
          <button id="nextBtn">Next</button>
        </div>
      </div>
    </div>
  </div>

 <script type="module" src="../../js/users.js"></script>
</body>
</html>
