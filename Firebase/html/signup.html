<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>


  <form id="signup" class="form">
    <p class="form-title">Sign up to your account</p>
    <div class="input-container">
      <input id="name" type="text" placeholder="e.g John Doe">
      <span>
      </span>
    </div>

    <div class="input-container">
      <input id="contact" type="number" placeholder="+384783743">
      <span>
      </span>
    </div>

    <div class="input-container">
      <input id="country" type="text" placeholder="Pakistan">
      <span>
      </span>
    </div>

 

    <div class="input-container">
      <input id="email" type="email" placeholder="Enter email">
      <span>
      </span>
    </div>
    <div class="input-container">
      <input id="password" type="password" placeholder="Enter password">
    </div>
    <button type="submit" class="submit">
      Sign up
    </button>
    <button id="google" style="background-color: crimson;" type="button" class="submit">
      Sign in with Google
    </button>

    <p class="signup-link">
      No account?
      <a href="./login.html">Sign in</a>
    </p>
  </form>

  <br><br><br><br><br><br>



  <br><br><br><br><br><br>

  <script type="module" src="../index.js"></script>
</body>

</html>
