<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
  <nav class="navbar">
    <a href="index.html" class="logo">← Back to <span>Blogs</span></a>
  </nav>

  <main class="container detail-container">
    <div id="blogDetail">
      <p class="loading">Loading Blog...</p>
    </div>

    <!-- Interaction Buttons -->
    <div class="blog-actions">
      <button id="likeBtn" class="btn">❤️ Like (<span id="likeCount">0</span>)</button>
      <button id="bookmarkBtn" class="btn">🔖 Bookmark</button>
      <button id="shareFb" class="btn">Share Facebook</button>
      <button id="shareWa" class="btn">Share WhatsApp</button>
    </div>

    <!-- Comments Section -->
    <section class="comments-section">
      <h3>Comments</h3>
      <form id="commentForm">
        <textarea id="commentText" placeholder="Add a comment..." required></textarea>
        <button type="submit" class="btn btn-primary">Post Comment</button>
      </form>
      <div id="commentsList"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
