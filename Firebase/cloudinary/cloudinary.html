<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <input id="img" type="file">
  <button id="Imgbtn">UploadImg</button>


  <script>

    let image = document.getElementById('img');

    let uploadImg = async () => {
      let cloudName = 'docmtwzxm';
      let uploadPreset = 'abcd1234';

      let formData = new FormData();
      formData.append("file", image.files[0]);
      formData.append("upload_preset", uploadPreset);

      let res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
        method: 'POST',
        body: formData
      })

      const data = await res.json();
      console.log(data.secure_url);

      return data.secure_url


    }

    document.getElementById('Imgbtn')?.addEventListener('click', uploadImg)




  </script>

</body>

</html>
